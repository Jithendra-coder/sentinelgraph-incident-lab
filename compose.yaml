services:
  sentinelgraph:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENTINELGRAPH_DB: /app/data/sentinelgraph.sqlite3
      LOG_LEVEL: INFO
      SENTINELGRAPH_PROMETHEUS_URL: ${SENTINELGRAPH_PROMETHEUS_URL:-}
      SENTINELGRAPH_PROMETHEUS_QUERY: ${SENTINELGRAPH_PROMETHEUS_QUERY:-}
      SENTINELGRAPH_PROMETHEUS_TOKEN: ${SENTINELGRAPH_PROMETHEUS_TOKEN:-}
    volumes:
      - sentinelgraph-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  sentinelgraph-data:
