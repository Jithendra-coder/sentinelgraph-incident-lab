name: SentinelGraph CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,lint]"
      - run: ruff check app tests evals benchmarks
      - run: python -m unittest discover -s tests -v
      - run: python evals/run.py --check
      - run: python benchmarks/run.py --check
      - run: docker build -t sentinelgraph:ci .
